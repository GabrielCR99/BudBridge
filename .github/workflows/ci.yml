# Continuous integration: secret scanning plus build and tests.
# Third-party actions are pinned to full commit SHAs; Dependabot keeps them up to date.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-history scan, so new gitleaks rules also check old commits.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for exposed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report in the job log and summary; no PR comments, so no extra permissions.
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Check for files that must not be committed
        run: scripts/check-forbidden-files.sh

  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Swift 6.2 / macOS 26 SDK, the oldest toolchain Package.swift supports.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build the app
        run: scripts/build-app.sh

      - name: Package
        run: ditto -c -k --keepParent build/BudBridge.app build/BudBridge.zip

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BudBridge-${{ github.sha }}
          path: build/BudBridge.zip
          retention-days: 7
          if-no-files-found: error
