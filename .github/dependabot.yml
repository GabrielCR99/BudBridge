# Keeps the pinned GitHub Actions and Swift packages up to date, with pull requests into development.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /
    target-branch: development
    schedule:
      interval: weekly
