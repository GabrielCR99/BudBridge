# SwiftLint configuration for BudBridge.
# Runs on every build through SwiftLintBuildToolPlugin (see Package.swift).
# Run by hand: swiftlint lint --strict

included:
  - Sources
  - Tests
excluded:
  - .build
  - build

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - todo
  # Swift 6 style: trailing commas keep multi-line diffs clean.
  - trailing_comma

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  # User-facing text is a localization key, so it can't be split without breaking translations.
  excluded_lines_patterns:
    - '^\s*(Text|Label|Button|Section|Toggle)\("[^"]*"\)'
    - 'String\(localized: "[^"]*"\)'

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

nesting:
  type_level: 2

identifier_name:
  min_length: 2
  excluded:
    - i
    - b
    - c
    - d
    - e
    - f
    - g
    - k
    - n
    - o
    - p
    - q
    - r
    - s
    - t
    - v
    - w

type_name:
  min_length: 2
  max_length: 50

large_tuple:
  warning: 3
